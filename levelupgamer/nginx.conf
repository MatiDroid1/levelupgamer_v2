server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # /api/productos -> http://msproductos:8080/productos
  location /api/productos/ {
    proxy_pass http://msproductos:8080/productos/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # /api/pedidos -> http://mspedidos:8081/pedidos
  location /api/pedidos/ {
    proxy_pass http://mspedidos:8081/pedidos/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}