services:
  msproductos:
    build:
      context: ./msproductos
    container_name: msproductos
    environment:
      - SERVER_PORT=8080
    ports:
      - "8080:8080"

  mspedidos:
    build:
      context: ./mspedidos
    container_name: mspedidos
    environment:
      - SERVER_PORT=8081
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./levelupgamer
    container_name: levelupgamer-frontend
    ports:
      - "80:80"
    depends_on:
      - msproductos
      - mspedidos